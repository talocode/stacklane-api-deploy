[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm run build"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions.api]
  maxDuration = 26

# TokenLane hosted routes live in netlify/functions/api.mjs + tokenlane-engine.mjs
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
