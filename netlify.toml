[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm run build"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
external_node_modules = ["@netlify/blobs", "pg"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
